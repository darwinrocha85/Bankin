# Blueprint de Render (opcional). Si prefieres, puedes configurar el
# servicio a mano desde el dashboard de Render con estos mismos valores
# (ver README.md, sección "Despliegue en Render").
services:
  - type: web
    name: bankinback
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AUTO_SEED
        value: "true"
      - key: ALLOWED_ORIGINS
        sync: false
